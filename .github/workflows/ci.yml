name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generated rules match slo/slos.yaml
        run: python tools/gen_rules.py --check
      - run: python -m unittest discover -s tools -v
      - name: promtool check + unit tests
        run: |
          docker run --rm -v "$PWD/observability/prometheus":/p --entrypoint promtool prom/prometheus:v2.55.1 check rules /p/rules/slo.rules.yml
          docker run --rm -v "$PWD/observability/prometheus":/p --entrypoint promtool prom/prometheus:v2.55.1 test rules /p/tests/slo.rules.test.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/envs/dev init -backend=false -input=false
      - run: terraform -chdir=infra/envs/dev validate

  image:
    needs: [go, rules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Print the immutable tag Terraform needs
        if: github.event_name == 'push'
        run: |
          echo "Terraform image tag: sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
