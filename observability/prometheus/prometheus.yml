global:
  scrape_interval: 5s       
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Local container, the SLO selector job=~"ledger.*" matches this and the azure job below
  - job_name: ledger
    static_configs:
      - targets: ["ledger:8080"]
        labels: {env: local}

  # Remote instance on azure Container Apps: HTTPS + bearer token
  # Targets come from targets/*.json, written by scripts/attach-azure.sh 
  - job_name: ledger-azure
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/azure_metrics_token
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 15s
