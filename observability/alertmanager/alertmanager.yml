route:
  receiver: sink
  group_by: [alertname, slo]
  group_wait: 10s        # demo-friendly; production is usually 30s+
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: sink
    webhook_configs:
      - url: http://alertsink:9095/webhook
        send_resolved: true

# If the fast page-level burn is firing, suppress the slower tickets for the same SLO:
# one incident should produce one notification, not four.
inhibit_rules:
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]
